name: Build RideshareBooks APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q RideshareBooks_fixed_project.zip -d extracted
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -1 | xargs dirname)
          echo "Project directory: $PROJECT_DIR"
          cp -R "$PROJECT_DIR"/app .
          cp -R "$PROJECT_DIR"/gradle .
          cp "$PROJECT_DIR"/build.gradle.kts . 2>/dev/null || cp "$PROJECT_DIR"/build.gradle .
          cp "$PROJECT_DIR"/settings.gradle.kts . 2>/dev/null || cp "$PROJECT_DIR"/settings.gradle .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Fix build configuration
        run: |
          sed -i 's#/META-INDEX/{AL2.0,LGPL2.1}#/META-INF/{AL2.0,LGPL2.1}#' app/build.gradle.kts || true

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RideshareBooks-APK
          path: app/build/outputs/apk/debug/app-debug.apk
